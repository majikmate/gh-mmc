name: Continuous Integration and Deployment

on: 
  push:
    tags:
      - v*
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'module-html-css/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'module-html-css/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # run the linter
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup go
        uses: ./.github/actions/setup-go

      - name: run the code linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  # test the code
  test:
    name: test
    needs: lint 
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup go
        uses: ./.github/actions/setup-go

      - name: run tests
        run: go test -race -v ./...

  # build the code
  build:
    name: build
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    
    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup go
        uses: ./.github/actions/setup-go

      - name: build
        run: go build -v -trimpath .

  # create a release when a tag is pushed
  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ startsWith(github.ref, 'refs/tags/v') }} 

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: build and release binaries
        uses: cli/gh-extension-precompile@v2.1.0
        with:
            go_version_file: go.mod
            generate_attestations: true
