name: Continuous Integration and Deployment

on: 
  push:
    tags:
      - v*
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # run the linter
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup go
        uses: ./.github/actions/setup-go

      - name: run the code linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          skip-cache: true

  # test the code
  test:
    name: test
    needs: lint 
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup go
        uses: ./.github/actions/setup-go

      - name: run tests
        run: go test -race -v ./...

  # build the code
  build:
    name: build
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    
    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup go
        uses: ./.github/actions/setup-go

      - name: build
        run: go build -v -trimpath .

  # create a release for macOS and Linux when a tag is pushed
  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ startsWith(github.ref, 'refs/tags/v') }} 

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup go
        uses: ./.github/actions/setup-go

      # binaries are named <os>-<arch>, which gh extension install looks for
      - name: build binaries
        run: |
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 linux-arm; do
            GOOS="${platform%-*}" GOARCH="${platform#*-}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "dist/${platform}" .
          done

      - name: generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE_PREFIX: ${{ github.event.repository.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- dist/*
          else
            prerelease=""
            if [[ "$TAG" == *-* ]]; then
              prerelease="--prerelease"
            fi
            gh release create "$TAG" $prerelease --title "$TITLE_PREFIX ${TAG#v}" --generate-notes -- dist/*
          fi
